<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Family Health</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
    .hidden { display: none !important; }
    .grid-avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid #e5e7eb; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; background: white; color: #3b82f6; }
    .active-avatar { border-color: #3b82f6; background: #eff6ff; }
  </style>
</head>
<body class="text-gray-800 antialiased pb-safe">

  <!-- 3x3 GRID LOGIN VIEW -->
  <div id="login-view" class="min-h-screen flex flex-col items-center justify-center p-4">
    <h1 class="text-2xl font-bold text-gray-800 mb-8">Select Profile</h1>
    
    <div class="grid grid-cols-3 gap-6 mb-8 max-w-sm w-full">
      <!-- Row 1 -->
      <div class="flex flex-col items-center cursor-pointer" onclick="selectProfile('aj', 'AJ')">
        <div id="avatar-aj" class="grid-avatar">AJ</div>
        <span class="mt-2 text-sm font-medium">AJ</span>
      </div>
      <div class="flex flex-col items-center cursor-pointer" onclick="selectProfile('meg', 'Meg')">
        <div id="avatar-meg" class="grid-avatar">M</div>
        <span class="mt-2 text-sm font-medium">Meg</span>
      </div>
      <div class="flex flex-col items-center cursor-pointer" onclick="selectProfile('zoya', 'Zoya')">
        <div id="avatar-zoya" class="grid-avatar">Z</div>
        <span class="mt-2 text-sm font-medium">Zoya</span>
      </div>
      <!-- Row 2 -->
      <div class="flex flex-col items-center cursor-pointer" onclick="selectProfile('dad-aj', 'AJ\\'s Dad')">
        <div id="avatar-dad-aj" class="grid-avatar">D1</div>
        <span class="mt-2 text-sm font-medium text-center">AJ's Dad</span>
      </div>
      <div class="flex flex-col items-center cursor-pointer" onclick="selectProfile('mom-aj', 'AJ\\'s Mom')">
        <div id="avatar-mom-aj" class="grid-avatar">M1</div>
        <span class="mt-2 text-sm font-medium text-center">AJ's Mom</span>
      </div>
      <div class="flex flex-col items-center cursor-pointer" onclick="selectProfile('sister', 'Sister')">
        <div id="avatar-sister" class="grid-avatar">S</div>
        <span class="mt-2 text-sm font-medium">Sister</span>
      </div>
      <!-- Row 3 -->
      <div class="flex flex-col items-center cursor-pointer" onclick="selectProfile('dad-meg', 'Meg\\'s Dad')">
        <div id="avatar-dad-meg" class="grid-avatar">D2</div>
        <span class="mt-2 text-sm font-medium text-center">Meg's Dad</span>
      </div>
      <div class="flex flex-col items-center cursor-pointer" onclick="selectProfile('mom-meg', 'Meg\\'s Mom')">
        <div id="avatar-mom-meg" class="grid-avatar">M2</div>
        <span class="mt-2 text-sm font-medium text-center">Meg's Mom</span>
      </div>
      <div class="flex flex-col items-center cursor-pointer" onclick="selectProfile('bil', 'Brother-in-Law')">
        <div id="avatar-bil" class="grid-avatar">B</div>
        <span class="mt-2 text-sm font-medium text-center">Bro-in-law</span>
      </div>
    </div>

    <!-- PIN Entry (Hidden until profile tapped) -->
    <div id="pin-section" class="hidden w-full max-w-sm bg-white p-6 rounded-xl shadow-lg text-center">
      <h3 id="pin-prompt" class="font-bold text-gray-700 mb-4">Enter PIN for...</h3>
      <input type="password" id="login-pin" pattern="[0-9]*" inputmode="numeric" class="w-full border-2 text-center text-2xl tracking-[0.5em] border-gray-300 rounded-md p-3 focus:border-blue-500 mb-4">
      <button onclick="verifyPin()" id="login-btn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-md">Unlock</button>
      <p id="login-error" class="text-red-500 text-sm mt-3 hidden">Incorrect PIN</p>
    </div>
  </div>

  <!-- DASHBOARD VIEW -->
  <div id="dashboard-view" class="hidden min-h-screen flex flex-col">
    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-10">
      <h1 class="font-bold text-lg" id="user-greeting">Health Dashboard</h1>
      <button onclick="logout()" class="text-sm bg-blue-700 px-3 py-1 rounded hover:bg-blue-800">Switch User</button>
    </header>

    <nav class="flex bg-white shadow overflow-x-auto">
      <button onclick="switchTab('records')" id="nav-records" class="flex-1 py-3 px-2 text-center font-medium border-b-2 border-blue-600 text-blue-600">Scan & Records</button>
      <button onclick="switchTab('medicines')" id="nav-medicines" class="flex-1 py-3 px-2 text-center font-medium border-b-2 border-transparent text-gray-500">Inventory & Meds</button>
    </nav>

    <main class="flex-1 p-4 overflow-y-auto pb-24">
      
      <!-- Records Section -->
      <section id="sec-records" class="space-y-4">
        <div class="bg-white p-4 rounded-lg shadow border-2 border-dashed border-gray-300">
          <h2 class="font-bold text-gray-700 mb-3 text-center">📷 Upload Doctor's Note / Scan</h2>
          <form id="form-record" class="space-y-4">
            <!-- Datalist for common diagnoses -->
            <input list="common-diagnoses" id="rec-diagnosis" placeholder="Diagnosis (Tap for common options)" required class="w-full border rounded p-3">
            <datalist id="common-diagnoses">
              <option value="General Checkup">
              <option value="Hypertension (Blood Pressure)">
              <option value="Diabetes (Blood Sugar)">
              <option value="Cholesterol Check">
              <option value="Fever / Infection">
              <option value="Orthopedic / Joint Pain">
            </datalist>
            
            <input type="date" id="rec-date" required class="w-full border rounded p-3">
            
            <!-- Camera Capture -->
            <div class="flex items-center justify-center w-full">
                <label for="rec-file" class="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100">
                    <div class="flex flex-col items-center justify-center pt-5 pb-6">
                        <svg class="w-8 h-8 mb-3 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        <p class="mb-2 text-sm text-gray-500 font-semibold" id="file-label">Tap to take picture / scan</p>
                    </div>
                    <input id="rec-file" type="file" accept="image/*" capture="environment" class="hidden" />
                </label>
            </div>
            
            <button type="submit" class="bg-blue-600 text-white px-4 py-3 rounded font-bold w-full text-lg shadow-md">Save PDF & Record</button>
          </form>
        </div>
        <div id="list-records" class="space-y-3"></div>
      </section>

      <!-- Medicines Section -->
      <section id="sec-medicines" class="space-y-4 hidden">
        <div class="bg-white p-4 rounded-lg shadow">
          <h2 class="font-bold text-gray-700 mb-3">Add Medicine & Track Inventory</h2>
          <form id="form-medicine" class="space-y-3">
            <input type="text" id="med-name" placeholder="Medicine Name" required class="w-full border rounded p-3">
            <input type="text" id="med-dose" placeholder="Dosage (e.g., 1 tablet, 5ml)" required class="w-full border rounded p-3">
            
            <div class="flex space-x-2">
              <input type="number" id="med-inventory" placeholder="Total tablets/ml you have" required class="w-1/2 border rounded p-3">
              <input type="number" id="med-per-day" placeholder="Total taken per day" required class="w-1/2 border rounded p-3">
            </div>
            <p id="calc-refill" class="text-sm font-semibold text-green-600 text-center py-2 bg-green-50 rounded hidden"></p>

            <select id="med-status" class="w-full border rounded p-3 bg-white">
              <option value="Active">Active Prescription</option>
              <option value="Inactive">Past Course</option>
            </select>
            <button type="submit" class="bg-green-600 text-white px-4 py-3 rounded font-bold w-full text-lg shadow-md">Save Medicine</button>
          </form>
        </div>
        <div id="list-medicines" class="space-y-3"></div>
      </section>

    </main>
  </div>

  <script>
    // -------------------------------------------------------------------
    // IMPORTANT: Paste your NEW Google Apps Script URL here
    // -------------------------------------------------------------------
    const API_URL = "https://script.google.com/macros/s/AKfycbylY418C3kcOu7BV6DRBO6uyZyEJaUmzqMfYPLYfytlWm-YLi-SEqVUJ0_rdAW_Wumd1g/exec"; 
    
    let selectedUserId = null;
    let selectedUserName = null;
    let currentUser = null;
    let base64ImageString = null;

    async function apiRequest(method, payload = null, tabName = "") {
      const url = method === "GET" ? `${API_URL}?tab=${tabName}` : API_URL;
      const options = { method: method, headers: { "Content-Type": "text/plain;charset=utf-8" } };
      if (payload) options.body = JSON.stringify(payload);
      try {
        const response = await fetch(url, options);
        return await response.json();
      } catch (error) {
        alert("Network error. Please check your connection.");
        return null;
      }
    }

    // UI & Grid Logic
    function selectProfile(id, name) {
      document.querySelectorAll('.grid-avatar').forEach(el => el.classList.remove('active-avatar'));
      document.getElementById(`avatar-${id}`).classList.add('active-avatar');
      
      selectedUserId = id;
      selectedUserName = name;
      document.getElementById('pin-section').classList.remove('hidden');
      document.getElementById('pin-prompt').innerText = `Enter PIN for ${name}`;
      document.getElementById('login-pin').value = '';
      document.getElementById('login-pin').focus();
    }

    async function verifyPin() {
      const btn = document.getElementById('login-btn');
      btn.innerText = "Loading Data..."; btn.disabled = true;
      const pin = document.getElementById('login-pin').value.trim();

      const profiles = await apiRequest("GET", null, "Profiles");
      if (profiles) {
        // Case-insensitive match on ID
        const user = profiles.find(p => p.UserID.toLowerCase() === selectedUserId.toLowerCase() && p.Pin == pin);
        if (user) {
          currentUser = user;
          document.getElementById('login-view').classList.add('hidden');
          document.getElementById('dashboard-view').classList.remove('hidden');
          document.getElementById('user-greeting').innerText = `${selectedUserName}'s Profile`;
          loadAllData();
        } else {
          document.getElementById('login-error').classList.remove('hidden');
        }
      }
      btn.innerText = "Unlock"; btn.disabled = false;
    }

    function logout() {
      currentUser = null;
      document.getElementById('pin-section').classList.add('hidden');
      document.querySelectorAll('.grid-avatar').forEach(el => el.classList.remove('active-avatar'));
      document.getElementById('dashboard-view').classList.add('hidden');
      document.getElementById('login-view').classList.remove('hidden');
    }

    function switchTab(tab) {
      ['records', 'medicines'].forEach(t => {
        document.getElementById(`sec-${t}`).classList.add('hidden');
        document.getElementById(`nav-${t}`).classList.replace('border-blue-600', 'border-transparent');
        document.getElementById(`nav-${t}`).classList.replace('text-blue-600', 'text-gray-500');
      });
      document.getElementById(`sec-${tab}`).classList.remove('hidden');
      document.getElementById(`nav-${tab}`).classList.replace('border-transparent', 'border-blue-600');
      document.getElementById(`nav-${tab}`).classList.replace('text-gray-500', 'text-blue-600');
    }

    // Dynamic Inventory Math
    const invInput = document.getElementById('med-inventory');
    const perDayInput = document.getElementById('med-per-day');
    const calcText = document.getElementById('calc-refill');

    function calculateRefill() {
      const inv = parseFloat(invInput.value);
      const daily = parseFloat(perDayInput.value);
      if (inv > 0 && daily > 0) {
        const daysLeft = Math.floor(inv / daily);
        let refillDate = new Date();
        refillDate.setDate(refillDate.getDate() + daysLeft);
        calcText.innerText = `Estimated Supply: ${daysLeft} days (Runs out: ${refillDate.toLocaleDateString()})`;
        calcText.classList.remove('hidden');
      } else {
        calcText.classList.add('hidden');
      }
    }
    invInput.addEventListener('input', calculateRefill);
    perDayInput.addEventListener('input', calculateRefill);

    // Image Upload Handling
    document.getElementById('rec-file').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        document.getElementById('file-label').innerText = "✅ " + file.name + " ready to save";
        const reader = new FileReader();
        reader.onloadend = () => { base64ImageString = reader.result; };
        reader.readAsDataURL(file);
      }
    });

    // Form Submissions
    function generateId(prefix) { return prefix + '-' + Math.random().toString(36).substr(2, 5).toUpperCase(); }

    document.getElementById('form-record').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.innerText = "Uploading to Drive & Saving..."; btn.disabled = true;
      const diag = document.getElementById('rec-diagnosis').value;
      const dDate = document.getElementById('rec-date').value;

      const payload = {
        tab: "Medical Records",
        userName: selectedUserName, // Used by Apps Script to create the personal folder
        fileName: `${diag} - ${dDate}`,
        fileData: base64ImageString,
        rowValues: [generateId('REC'), currentUser.UserID, dDate, diag, diag] // Appending Note + Diagnosis
      };
      
      await apiRequest("POST", payload);
      e.target.reset();
      document.getElementById('file-label').innerText = "Tap to take picture / scan";
      base64ImageString = null;
      btn.innerText = "Save PDF & Record"; btn.disabled = false;
      loadRecords(); 
    });

    document.getElementById('form-medicine').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.innerText = "Saving..."; btn.disabled = true;

      const inv = parseFloat(invInput.value);
      const daily = parseFloat(perDayInput.value);
      const daysLeft = (inv > 0 && daily > 0) ? Math.floor(inv / daily) : 0;

      const payload = {
        tab: "Medicines",
        rowValues: [
          generateId('MED'),
          currentUser.UserID,
          document.getElementById('med-name').value,
          document.getElementById('med-dose').value,
          `${daily} per day`,
          document.getElementById('med-status').value,
          inv,
          daily,
          daysLeft
        ]
      };
      
      await apiRequest("POST", payload);
      e.target.reset();
      calcText.classList.add('hidden');
      btn.innerText = "Save Medicine"; btn.disabled = false;
      loadMedicines(); 
    });

    // Loaders
    async function loadRecords() {
      const list = document.getElementById('list-records');
      const data = await apiRequest("GET", null, "Medical Records");
      if (!data) return;
      const myRecords = data.filter(r => r.UserID.toLowerCase() === currentUser.UserID.toLowerCase()).reverse();
      list.innerHTML = myRecords.length === 0 ? '<p class="text-center text-gray-500">No records found.</p>' : '';
      
      myRecords.forEach(r => {
        const fileLinkHtml = r['File URL'] ? `<a href="${r['File URL']}" target="_blank" class="text-sm text-blue-600 underline mt-2 block">📄 View Scan / PDF</a>` : '';
        list.innerHTML += `
          <div class="bg-white p-4 rounded-lg shadow border-l-4 border-blue-500">
            <div class="flex justify-between items-start">
              <h3 class="font-bold text-gray-800">${r.Diagnosis}</h3>
              <span class="text-xs bg-gray-100 px-2 py-1 rounded">${r.Date}</span>
            </div>
            ${fileLinkHtml}
          </div>`;
      });
    }

    async function loadMedicines() {
      const list = document.getElementById('list-medicines');
      const data = await apiRequest("GET", null, "Medicines");
      if (!data) return;
      const myMeds = data.filter(m => m.UserID.toLowerCase() === currentUser.UserID.toLowerCase());
      list.innerHTML = myMeds.length === 0 ? '<p class="text-center text-gray-500">No medicines found.</p>' : '';
      
      myMeds.forEach(m => {
        const statusColor = m.Status === 'Active' ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-600';
        let supplyNote = m['Days Remaining'] ? `<p class="text-sm font-semibold text-orange-600 mt-2">Supply: ~${m['Days Remaining']} days left</p>` : '';
        list.innerHTML += `
          <div class="bg-white p-4 rounded-lg shadow">
            <div class="flex justify-between items-center mb-1">
              <h3 class="font-bold text-gray-800">${m['Medicine Name']}</h3>
              <span class="text-xs px-2 py-1 rounded-full ${statusColor}">${m.Status}</span>
            </div>
            <p class="text-sm text-gray-600"><strong>Dose:</strong> ${m.Dosage} | <strong>Freq:</strong> ${m.Frequency}</p>
            ${supplyNote}
          </div>`;
      });
    }

    async function loadAllData() { loadRecords(); loadMedicines(); }
    document.getElementById('rec-date').valueAsDate = new Date();
  </script>
</body>
</html>
